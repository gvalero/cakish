name = "cakish-stripe-checkout"
main = "stripe-checkout.js"
compatibility_date = "2025-01-01"

# After `wrangler d1 create cakish-orders-production`, uncomment this block and
# replace database_id with the real ID printed by Wrangler. Never reuse the
# production database in development.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "cakish-orders-production"
# database_id = "replace-with-real-d1-id"
# migrations_dir = "migrations"

[vars]
NOTIFY_EMAIL = "hello@cakish.ie"
WHATSAPP_PHONE = "353834462295"
RESEND_FROM = "Cakish <orders@cakish.ie>"
# Canonical checkout return origin and exact browser origins allowed to call the
# public checkout/status routes. Both current production hostnames are allowed.
STOREFRONT_URL = "https://cakish.ie"
ALLOWED_STOREFRONT_ORIGINS = "https://cakish.ie,https://www.cakish.ie"
# ACCESS_TEAM_DOMAIN accepts only the hostname form <team>.cloudflareaccess.com
# (no scheme or path). ACCESS_AUD is the exact Access application AUD tag.
# Configure all three Access values together; partial configuration fails closed.
# ACCESS_TEAM_DOMAIN = "your-team.cloudflareaccess.com"
# ACCESS_AUD = "replace-with-access-application-aud"
# ADMIN_ALLOWED_EMAILS = "owner@example.com"

# Secrets are configured with `wrangler secret put`:
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY, ADMIN_API_SECRET
